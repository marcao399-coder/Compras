<!DOCTYPE html>

            color: #1a2b39;
        }
        
        .header-fixo {
            background: #ffffffdd;
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px 10px;
            border-bottom: 1px solid #dde7f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .titulo-principal h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(148deg, #15455e, #1e5f7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .abas-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 6px;
            scrollbar-width: thin;
        }
        .aba-btn {
            background: white;
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #5a7e9a;
            cursor: pointer;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }
        .aba-btn.ativa {
            background: #1b587c;
            color: white;
        }
        
        .atalhos-fixos {
            margin-top: 6px;
            padding: 4px 0;
        }
        .atalhos-wrapper {
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .atalhos-container {
            display: inline-flex;
            gap: 8px;
            padding: 4px 2px;
        }
        .btn-atalho {
            background: rgba(255,255,255,0.95);
            border: 1px solid #cbdde9;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-atalho:active {
            transform: scale(0.96);
        }
        
        /* ESPAÇO PARA O HEADER FIXO (aumentado para 165px) */
        .spacer {
            height: 165px;
        }
        
        .conteudo-rolavel {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 14px 30px;
        }
        
        .card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.04);
            text-align: center;
        }
        .card-titulo {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            border-left: 5px solid #1b587c;
            padding-left: 14px;
            text-align: left;
        }
        .valor-destaque {
            font-size: 1.8rem;
            font-weight: 800;
        }
        .valor-positivo {
            color: #2e7d32;
        }
        .valor-negativo {
            color: #c62828;
        }
        .campo-editor {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1b587c;
            border: 2px solid #cbdde9;
            border-radius: 20px;
            padding: 10px 16px;
            width: 100%;
            text-align: center;
            outline: none;
        }
        
        .secao {
            background: #fafcff;
            border-radius: 24px;
            margin-bottom: 20px;
            padding: 8px 0;
            border: 1px solid #e5edf5;
            /* AUMENTADO para não ficar atrás do header */
            scroll-margin-top: 190px;
        }
        .secao-titulo {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            background: #fafcff;
            border-radius: 24px 24px 0 0;
        }
        .produto-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .campo-nome {
            flex: 2;
            background: white;
            border: 1px solid #deecf5;
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 0.85rem;
            min-width: 120px;
        }
        .campo-qtd, .campo-preco {
            width: 70px;
            background: white;
            border: 1px solid #deecf5;
            border-radius: 40px;
            padding: 8px 6px;
            text-align: right;
        }
        .item-total {
            min-width: 75px;
            background: #e2eff9;
            padding: 6px 8px;
            border-radius: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .btn-download {
            background: #1b587c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin-top: 16px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .footer-assinatura {
            text-align: center;
            font-size: 0.7rem;
            color: #8aaec2;
            padding: 16px;
        }
        .resumo-linha {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .resumo-total {
            font-weight: 800;
            font-size: 1.1rem;
        }
        .mes-ano-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        select, .btn-salvar-mes {
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #cbdde9;
            background: white;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-salvar-mes {
            background: #1b587c;
            color: white;
            border: none;
        }
    </style>
</head>

    const categoriasCoop = ["Mercearia","Pet","Laticínios e Iogurtes","Higiene Pessoal","Limpeza Doméstica"];
    const petProdutosPadrao = [
        { nome: "Ração Cão 10kg", qtd: 1, preco: 85.0 },
        { nome: "Petisco", qtd: 2, preco: 12.0 },
        { nome: "Areia para gato", qtd: 1, preco: 15.0 }

    function getDadosPadrao() {
        const nagumo = JSON.parse(JSON.stringify(produtosPadrao));
        const assai = JSON.parse(JSON.stringify(produtosPadrao));
        const coop = JSON.parse(JSON.stringify(produtosPadrao));
        coop["Pet"] = JSON.parse(JSON.stringify(petProdutosPadrao));
        for (let cat of Object.keys(coop)) {
            if (!categoriasCoop.includes(cat) && cat !== "Pet") {
                delete coop[cat];
            }
        }
        return {
            saldoInicial: 1500.00,
            dadosNagumo: nagumo,
            dadosAssai: assai,
            dadosCoop: coop
        };
    }

    const categoriasCompletas = Object.keys(produtosPadrao);
    let dadosAtuais = getDadosPadrao();
    let abaAtiva = "orcamento";
    let mesAnoAtivo = "Abril 2026";

    const ultimoMesSalvo = localStorage.getItem("ultimoMesAtivo");
    if (ultimoMesSalvo) {
        mesAnoAtivo = ultimoMesSalvo;
        carregarDadosDoMes(mesAnoAtivo);
    }

    function formatMoney(v) { return "R$ " + v.toFixed(2).replace('.',','); }

    function calcularTotais(dados, categorias) {
        let total = 0, itens = 0;
        for (let cat of categorias) {
            if (dados[cat]) {
                for (let p of dados[cat]) {
                    total += p.qtd * p.preco;
                    itens += p.qtd;
                }
            }
        }
        return { total, itens };
    }

    function calcularTudo() {
        const nag = calcularTotais(dadosAtuais.dadosNagumo, categoriasCompletas);
        const ass = calcularTotais(dadosAtuais.dadosAssai, categoriasCompletas);
        const coop = calcularTotais(dadosAtuais.dadosCoop, categoriasCoop);
        const totalGasto = nag.total + ass.total + coop.total;
        const totalItens = nag.itens + ass.itens + coop.itens;
        return { nag, ass, coop, totalGasto, totalItens };
    }

    function atualizaResumo() {
        const resumoDiv = document.getElementById("resumoConteudo");
        if (!resumoDiv) return;
        const { nag, ass, coop, totalGasto, totalItens } = calcularTudo();
        const saldoRestante = dadosAtuais.saldoInicial - totalGasto;
        const isNegativo = saldoRestante < 0;
        const iconeSaldo = isNegativo ? "❌" : "✅";
        const classeSaldo = isNegativo ? "valor-negativo" : "valor-positivo";
        
        resumoDiv.innerHTML = `
            <div class="resumo-linha"><span>🔵 Orçamento Inicial:</span><strong class="valor-positivo">${formatMoney(dadosAtuais.saldoInicial)}</strong></div>
            <div class="resumo-linha"><span>🟠 Nagumo:</span><strong>${formatMoney(nag.total)} (${nag.itens} itens)</strong></div>
            <div class="resumo-linha"><span>📋 Assaí:</span><strong>${formatMoney(ass.total)} (${ass.itens} itens)</strong></div>
            <div class="resumo-linha"><span>🟣 Coop/Carrefour:</span><strong>${formatMoney(coop.total)} (${coop.itens} itens)</strong></div>
            <div class="resumo-linha"><span>✅ Total de Itens:</span><strong>${totalItens} itens</strong></div>
            <div class="resumo-linha"><span>🟡 Total Gasto:</span><strong>${formatMoney(totalGasto)}</strong></div>
            <div class="resumo-linha resumo-total"><span>${iconeSaldo} Saldo Restante:</span><strong class="${classeSaldo}">${formatMoney(saldoRestante)}</strong></div>
        `;
    }

    function atualizaTotaisOrcamento() {
        const { totalGasto } = calcularTudo();
        const restante = dadosAtuais.saldoInicial - totalGasto;
        const isNegativo = restante < 0;
        const iconeSaldo = isNegativo ? "❌" : "✅";
        const classeSaldo = isNegativo ? "valor-negativo" : "valor-positivo";
        
        const totalGastoDisplay = document.getElementById("totalGastoDisplay");
        const saldoRestDisplay = document.getElementById("saldoRestanteDisplay");
        const iconeSaldoSpan = document.getElementById("iconeSaldoSpan");
        
        if (totalGastoDisplay) totalGastoDisplay.innerText = formatMoney(totalGasto);
        if (saldoRestDisplay) {
            saldoRestDisplay.innerText = formatMoney(restante);
            saldoRestDisplay.className = `valor-destaque ${classeSaldo}`;
        }
        if (iconeSaldoSpan) {
            iconeSaldoSpan.innerText = iconeSaldo;
        }
    }

    function setCursorToEnd(element) {
        if (element) {
            const val = element.value;
            element.focus();
            element.setSelectionRange(val.length, val.length);
        }
    }

    function setupEnterNavigation(inputs) {
        for (let i = 0; i < inputs.length; i++) {
            const inp = inputs[i];
            const oldHandler = inp._enterHandler;
            if (oldHandler) inp.removeEventListener("keypress", oldHandler);
            
            const handler = (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    const nextIndex = i + 1;
                    if (nextIndex < inputs.length) {
                        inputs[nextIndex].focus();
                        setCursorToEnd(inputs[nextIndex]);
                    } else {
                        inputs[0].focus();
                        setCursorToEnd(inputs[0]);
                    }
                }
            };
            inp.addEventListener("keypress", handler);
            inp._enterHandler = handler;
        }
    }

    function criarBotoesAtalho(categorias) {
        const container = document.getElementById("atalhosContainer");
        const atalhosFixosDiv = document.getElementById("atalhosFixos");
        
        if (!categorias || categorias.length === 0) {
            atalhosFixosDiv.style.display = "none";
            return;
        }
        
        atalhosFixosDiv.style.display = "block";
        container.innerHTML = "";
        
        for (let cat of categorias) {
            let icone = iconesCat[cat] || "📦";
            const btn = document.createElement("button");
            btn.className = "btn-atalho";
            btn.innerHTML = `${icone} ${cat}`;
            btn.addEventListener("click", () => {
                const el = document.getElementById(`secao-${cat}`);
                if (el) {
                    el.scrollIntoView({ behavior: "smooth", block: "start" });
                    el.style.transition = "0.2s";
                    el.style.boxShadow = "0 0 0 3px #1b587c";
                    setTimeout(() => { el.style.boxShadow = ""; }, 800);
                }
            });
            container.appendChild(btn);
        }
    }

    function renderMercado(nome, dados, categorias) {
        criarBotoesAtalho(categorias);
        
        const container = document.getElementById("appContainer");
        container.innerHTML = `<div id="secoesMercado"></div>
                               <button class="btn-download" id="downloadMercadoBtn">⬇️ Baixar lista ${nome} .txt</button>`;
        
        const secoesDiv = document.getElementById("secoesMercado");
        
        let html = "";
        for (let cat of categorias) {
            let produtos = dados[cat] || [];
            if (produtos.length === 0) continue;
            let totalCat = 0;
            let linhas = "";
            produtos.forEach((prod, idx) => {
                let totalItem = prod.qtd * prod.preco;
                totalCat += totalItem;
                linhas += `<div class="produto-row" data-cat="${cat}" data-idx="${idx}">
                    <input type="text" class="campo-nome" value="${prod.nome.replace(/"/g, '&quot;')}">
                    <input type="number" class="campo-qtd" value="${prod.qtd}" step="0.1" min="0">
                    <input type="number" class="campo-preco" value="${prod.preco}" step="0.01" min="0">
                    <span class="item-total">${formatMoney(totalItem)}</span>
                </div>`;
            });
            html += `<div class="secao" id="secao-${cat}">
                        <div class="secao-titulo">${iconesCat[cat]||'📦'} ${cat} <span class="secao-total">${formatMoney(totalCat)}</span></div>
                        ${linhas}
                    </div>`;
        }
        secoesDiv.innerHTML = html;
        
        document.querySelectorAll(".produto-row").forEach(row => {
            const cat = row.dataset.cat;
            const idx = parseInt(row.dataset.idx);
            const nomeInp = row.querySelector(".campo-nome");
            const qtdInp = row.querySelector(".campo-qtd");
            const precoInp = row.querySelector(".campo-preco");
            
            setupEnterNavigation([nomeInp, qtdInp, precoInp]);
            
            function update() {
                if (dados[cat] && dados[cat][idx]) {
                    dados[cat][idx].nome = nomeInp.value;
                    dados[cat][idx].qtd = parseFloat(qtdInp.value) || 0;
                    dados[cat][idx].preco = parseFloat(precoInp.value) || 0;
                    
                    const totalItem = dados[cat][idx].qtd * dados[cat][idx].preco;
                    const totalSpan = row.querySelector(".item-total");
                    if (totalSpan) totalSpan.innerText = formatMoney(totalItem);
                    
                    let totalCat = 0;
                    for (let p of dados[cat]) {
                        totalCat += p.qtd * p.preco;
                    }
                    const secaoDiv = document.getElementById(`secao-${cat}`);
                    if (secaoDiv) {
                        const tituloSpan = secaoDiv.querySelector('.secao-total');
                        if (tituloSpan) tituloSpan.innerText = formatMoney(totalCat);
                    }
                    
                    atualizaTotaisOrcamento();
                    atualizaResumo();
                }
            }
            
            nomeInp.addEventListener("input", update);
            qtdInp.addEventListener("input", update);
            precoInp.addEventListener("input", update);
        });
        
        document.getElementById("downloadMercadoBtn").addEventListener("click", () => {
            let texto = `🛒 LISTA ${nome.toUpperCase()} - ${mesAnoAtivo}\n=================================\n`;
            let totalGeral = 0, totalItens = 0;
            for (let cat of categorias) {
                let produtos = dados[cat] || [];
                if(produtos.length){
                    texto += `\n📦 ${cat}:\n`;
                    produtos.forEach(p => {
                        const subtotal = p.qtd * p.preco;
                        totalGeral += subtotal;
                        totalItens += p.qtd;
                        texto += `   • ${p.nome} | ${p.qtd} und | unit ${formatMoney(p.preco)} | total ${formatMoney(subtotal)}\n`;
                    });
                }
            }
            texto += `\n💰 TOTAL: ${formatMoney(totalGeral)} (${totalItens} itens)\n`;
            const blob = new Blob([texto], {type:"text/plain;charset=utf-8"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `lista_${nome.toLowerCase()}_${mesAnoAtivo.replace(/ /g, "_")}.txt`;
            link.click();
        });
    }

    function salvarDadosMes() {
        const selectMes = document.getElementById("selectMesAno");
        if (!selectMes) return;
        const mesAno = selectMes.value;
        const dadosParaSalvar = {
            saldoInicial: dadosAtuais.saldoInicial,
            dadosNagumo: dadosAtuais.dadosNagumo,
            dadosAssai: dadosAtuais.dadosAssai,
            dadosCoop: dadosAtuais.dadosCoop,
            dataSalvamento: new Date().toISOString()
        };
        localStorage.setItem(`compras_${mesAno}`, JSON.stringify(dadosParaSalvar));
        localStorage.setItem("ultimoMesAtivo", mesAno);
        alert(`✅ Dados de ${mesAno} salvos com sucesso!`);
    }

    function carregarDadosDoMes(mesAno) {
        const dadosSalvos = localStorage.getItem(`compras_${mesAno}`);
        if (dadosSalvos) {
            const carregado = JSON.parse(dadosSalvos);
            dadosAtuais = {
                saldoInicial: carregado.saldoInicial,
                dadosNagumo: carregado.dadosNagumo,
                dadosAssai: carregado.dadosAssai,
                dadosCoop: carregado.dadosCoop
            };
        } else {
            dadosAtuais = getDadosPadrao();
        }
        mesAnoAtivo = mesAno;
        
        const selectMes = document.getElementById("selectMesAno");
        if (selectMes) selectMes.value = mesAno;
        
        renderAba(abaAtiva);
    }

    function onChangeMes() {
        const selectMes = document.getElementById("selectMesAno");
        if (selectMes) {
            const novoMes = selectMes.value;
            if (novoMes !== mesAnoAtivo) {
                carregarDadosDoMes(novoMes);
            }
        }
    }

    function gerarSelectMesAno() {
        const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        let options = "";
        for (let ano = 2026; ano <= 2034; ano++) {
            for (let i = 0; i < meses.length; i++) {
                const mesAnoValue = `${meses[i]} ${ano}`;
                const selected = (mesAnoValue === mesAnoAtivo) ? "selected" : "";
                options += `<option value="${mesAnoValue}" ${selected}>${mesAnoValue}</option>`;
            }
        }
        return options;
    }

    function renderOrcamento() {
        document.getElementById("atalhosFixos").style.display = "none";
        const container = document.getElementById("appContainer");
        
        const { totalGasto } = calcularTudo();
        const restante = dadosAtuais.saldoInicial - totalGasto;
        const isNegativo = restante < 0;
        const iconeSaldo = isNegativo ? "❌" : "✅";
        const classeSaldo = isNegativo ? "valor-negativo" : "valor-positivo";
        
        container.innerHTML = `
            <div class="card">
                <div class="card-titulo">📅 Mês de Referência</div>
                <div class="mes-ano-selector">
                    <select id="selectMesAno" onchange="onChangeMes()">${gerarSelectMesAno()}</select>
                    <button class="btn-salvar-mes" id="btnSalvarMes">💾 Salvar</button>
                </div>
            </div>
            <div class="card">
                <div class="card-titulo">💰 SALDO INICIAL (VR + VA + Dinheiro)</div>
                <input type="number" id="saldoInput" class="campo-editor" step="100" value="${dadosAtuais.saldoInicial.toFixed(2)}">
            </div>
            <div class="card">
                <div class="card-titulo">💸 TOTAL GASTO</div>
                <div class="valor-destaque" id="totalGastoDisplay">${formatMoney(totalGasto)}</div>
            </div>
            <div class="card">
                <div class="card-titulo"><span id="iconeSaldoSpan">${iconeSaldo}</span> SOBRAM</div>
                <div class="valor-destaque ${classeSaldo}" id="saldoRestanteDisplay">${formatMoney(restante)}</div>
            </div>
        `;
        
        document.getElementById("saldoInput")?.addEventListener("input", (e) => {
            dadosAtuais.saldoInicial = parseFloat(e.target.value) || 0;
            atualizaTotaisOrcamento();
            atualizaResumo();
        });
        
        document.getElementById("btnSalvarMes")?.addEventListener("click", salvarDadosMes);
        
        atualizaTotaisOrcamento();
    }

    function renderResumo() {
        document.getElementById("atalhosFixos").style.display = "none";
        const container = document.getElementById("appContainer");
        container.innerHTML = `
            <div class="card">
                <div class="card-titulo">📊 RESUMO · ${mesAnoAtivo}</div>
                <div id="resumoConteudo"></div>
                <button class="btn-download" id="downloadResumoBtn">📄 Baixar Resumo .txt</button>
            </div>
        `;
        atualizaResumo();
        document.getElementById("downloadResumoBtn")?.addEventListener("click", () => {
            const { nag, ass, coop, totalGasto, totalItens } = calcularTudo();
            const saldoRestante = dadosAtuais.saldoInicial - totalGasto;
            let texto = `📊 RESUMO FAMILIAR - ${mesAnoAtivo}\n`;
            texto += `🔵 Orçamento Inicial: ${formatMoney(dadosAtuais.saldoInicial)}\n`;
            texto += `🟠 Nagumo: ${formatMoney(nag.total)} (${nag.itens} itens)\n`;
            texto += `📋 Assaí: ${formatMoney(ass.total)} (${ass.itens} itens)\n`;
            texto += `🟣 Coop/Carrefour: ${formatMoney(coop.total)} (${coop.itens} itens)\n`;
            texto += `✅ Total Itens: ${totalItens} itens\n`;
            texto += `🟡 Total Gasto: ${formatMoney(totalGasto)}\n`;
            texto += `❌ Saldo Restante: ${formatMoney(saldoRestante)}\n`;
            const blob = new Blob([texto], {type:"text/plain;charset=utf-8"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `resumo_${mesAnoAtivo.replace(/ /g, "_")}.txt`;
            link.click();
        });
    }

    function renderAba(aba) {
        if (aba === "orcamento") renderOrcamento();
        else if (aba === "nagumo") renderMercado("Nagumo", dadosAtuais.dadosNagumo, categoriasCompletas);
        else if (aba === "assai") renderMercado("Assaí", dadosAtuais.dadosAssai, categoriasCompletas);
        else if (aba === "coop") renderMercado("Coop/Carrefour", dadosAtuais.dadosCoop, categoriasCoop);
        else if (aba === "resumo") renderResumo();
    }

    function criarAbas() {
        const abas = ["orcamento","nagumo","assai","coop","resumo"];
        const nomes = ["💰 ORÇAMENTO","🟠 NAGUMO","📋 ASSAÍ","🟣 COOP","📊 RESUMO"];
        const containerAbas = document.getElementById("abasContainer");
        containerAbas.innerHTML = "";
        abas.forEach((aba, i) => {
            const btn = document.createElement("button");
            btn.className = "aba-btn";
            if (aba === abaAtiva) btn.classList.add("ativa");
            btn.innerText = nomes[i];
            btn.onclick = () => {
                abaAtiva = aba;
                document.querySelectorAll(".aba-btn").forEach(b => b.classList.remove("ativa"));
                btn.classList.add("ativa");
                renderAba(abaAtiva);
            };
            containerAbas.appendChild(btn);
        });
    }

    window.onChangeMes = onChangeMes;

    function init() {
        criarAbas();
        renderAba("orcamento");
    }
    init();
</script>
</body>
</html>
